# 版本号的**唯一来源**（Single Source of Truth）
#
# 规则只有一条：**只有明确说「发版 / 发布版本」时才改这个文件。**
# 平时的提交、修 bug、加功能一律不动它 —— 版本号不是提交计数器。
#
# 下面这三个数是「上一个已发布的版本」。没发布过的改动全部堆在
# CHANGELOG.md 的 ## [Unreleased] 段落里，等真要发版时再一次性决定进位到哪个号。
#
# 进位规则（语义化版本，见 AGENT.md §5.1）：
#   major  对外行为 / 数据格式**不兼容**的改动          1.19.0 → 2.0.0
#   minor  向后兼容地加功能、加选项                      1.19.0 → 1.20.0
#   patch  向后兼容地修缺陷，不改接口与行为约定          1.19.0 → 1.19.1
#
# 手动改这几个数也可以，改完跑一次：
#   cd android-app && ./gradlew ver        # 打印 versionName / versionCode 确认
# 或者直接用发版脚本（它会一起做 CHANGELOG 检查、构建和打 tag）：
#   python release.py minor                # / major / patch
#
# version.prefix：versionName 的**纯展示前缀**，可空（留空就是纯数字 1.11.1）。
#   它只拼在 versionName 前面（versionName = prefix + "major.minor.patch"），
#   **完全不参与 versionCode 计算** —— versionCode 仍是
#   major*10000 + minor*100 + patch 的纯数字，保证 Android 侧单调递增。
#   release.py 进位时不会改动它，前缀只在需要时手工改这一行。

version.prefix=G
version.major=1
version.minor=11
version.patch=1
